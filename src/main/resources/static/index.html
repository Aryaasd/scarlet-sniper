<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScarletSniper</title>
<meta name="description" content="Get texted the second a closed Rutgers course section opens up.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #14151a;
    --surface: #1c1e24;
    --surface-raised: #23252c;
    --border: #2e3038;
    --border-focus: #cc0033;
    --text: #f2f2f3;
    --text-dim: #9a9ba3;
    --text-faint: #5c5e68;
    --accent: #d6003f;
    --accent-hover: #f10047;
    --accent-soft: rgba(214, 0, 63, 0.12);
    --success: #2ecc71;
    --success-soft: rgba(46, 204, 113, 0.14);
    --danger: #ff5c5c;
    --warning: #e8a33d;
    --warning-soft: rgba(232, 163, 61, 0.12);
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.55);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(214, 0, 63, 0.10), transparent 40%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 56px 20px;
  }

  .app { width: 100%; max-width: 460px; }

  header { margin-bottom: 24px; text-align: center; }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .logo-mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    box-shadow: 0 6px 16px -4px rgba(214, 0, 63, 0.6);
    flex-shrink: 0;
  }

  .logo-word-accent { color: var(--accent); }

  .tagline {
    margin: 8px 0 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  input::placeholder { color: var(--text-faint); }
  input:focus { border-color: var(--border-focus); background: #26282f; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .advanced-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0 14px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .advanced-toggle:hover { color: var(--text); }
  .advanced-toggle .chev { transition: transform 0.15s; font-size: 10px; }
  .advanced-toggle.open .chev { transform: rotate(90deg); }

  .advanced-panel {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
    padding: 14px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .advanced-panel.open { display: grid; }
  .advanced-panel .field { margin-bottom: 0; }

  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 4px;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:active { transform: scale(0.99); }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .banner {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .banner.show { display: flex; }
  .banner.error { background: rgba(255, 92, 92, 0.12); color: var(--danger); border: 1px solid rgba(255, 92, 92, 0.25); }
  .banner.info { background: var(--accent-soft); color: #ff8fae; border: 1px solid rgba(214, 0, 63, 0.25); }

  .section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 26px 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-heading h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0;
    font-weight: 700;
  }
  .section-heading .count {
    font-size: 11.5px;
    color: var(--text-faint);
  }

  #targetList { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }

  .empty-state {
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
    padding: 28px 10px;
    font-style: italic;
  }

  li.target {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    animation: rise 0.2s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  li.target.unconfirmed {
    flex-direction: column;
    align-items: stretch;
    border-color: rgba(232, 163, 61, 0.3);
    background: linear-gradient(var(--warning-soft), var(--warning-soft)), var(--surface-raised);
  }

  .target-index { font-size: 16px; font-weight: 700; color: var(--text); }
  .target-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .target-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .target-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

  .unverified-pill {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 5px 9px;
    border-radius: 20px;
    background: var(--warning-soft);
    color: var(--warning);
    white-space: nowrap;
  }

  .verify-row { display: flex; gap: 8px; margin-top: 12px; }
  .verify-row input {
    flex: 1;
    padding: 9px 12px;
    font-size: 14px;
    letter-spacing: 0.08em;
  }
  .verify-btn {
    padding: 0 16px;
    background: var(--warning);
    color: #1a1206;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .verify-btn:hover { filter: brightness(1.08); }
  .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .verify-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 11px;
  }
  .verify-hint { color: var(--text-faint); }
  .verify-error { color: var(--danger); font-weight: 600; }
  .resend-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .resend-btn:hover { color: var(--text); }
  .resend-btn:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: none; }

  .status-pill {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 5px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .status-pill.closed { background: #34363f; color: var(--text-dim); }
  .status-pill.open { background: var(--success-soft); color: var(--success); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  .del-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .del-btn:hover { border-color: var(--danger); color: var(--danger); }
  .del-btn.confirming {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
    width: auto;
    padding: 0 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="badge" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop stop-color="#d6003f"/>
            <stop offset="1" stop-color="#7a0026"/>
          </linearGradient>
        </defs>
        <rect width="128" height="128" rx="32" fill="url(#badge)"/>
        <circle cx="64" cy="64" r="30" fill="none" stroke="white" stroke-width="6" opacity="0.96"/>
        <circle cx="64" cy="64" r="7" fill="white"/>
        <line x1="64" y1="12" x2="64" y2="30" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <line x1="64" y1="98" x2="64" y2="116" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <line x1="12" y1="64" x2="30" y2="64" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <line x1="98" y1="64" x2="116" y2="64" stroke="white" stroke-width="6" stroke-linecap="round"/>
      </svg>
      Scarlet<span class="logo-word-accent">Sniper</span>
    </div>
    <p class="tagline">Get texted the second a closed section opens up.</p>
  </header>

  <div class="card">
    <div id="banner" class="banner"></div>

    <div class="field">
      <label for="index">Course Index Number</label>
      <input type="text" id="index" placeholder="e.g. 03608" maxlength="5" inputmode="numeric">
    </div>

    <div class="field">
      <label for="phone">Your Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 9085551234" inputmode="tel">
    </div>

    <button type="button" class="advanced-toggle" id="advancedToggle">
      <span class="chev">▶</span> Track a different subject or term
    </button>
    <div class="advanced-panel" id="advancedPanel">
      <div class="field">
        <label for="subject">Subject Code</label>
        <input type="text" id="subject" placeholder="198 (default)" maxlength="10">
      </div>
      <div class="field">
        <label for="term">Term Code</label>
        <input type="text" id="term" placeholder="9 = Fall (default)" maxlength="5">
      </div>
      <div class="field">
        <label for="year">Year</label>
        <input type="number" id="year" placeholder="2025 (default)">
      </div>
      <div class="field">
        <label for="campus">Campus</label>
        <input type="text" id="campus" placeholder="NB (default)" maxlength="10">
      </div>
    </div>

    <button type="button" class="primary" id="addBtn" onclick="addSection()">Start Watching</button>

    <div class="section-heading">
      <h2>Active Targets</h2>
      <span class="count" id="targetCount"></span>
    </div>
    <ul id="targetList"></ul>
  </div>

  <footer>
    Watches are private to this browser — no login, just a token stored locally.<br>
    Clearing your browser storage means you lose access to manage existing watches.
  </footer>
</div>

<script>
  const API_URL = '/api/sections';
  const STORAGE_KEY = 'sniper.watches'; // [{id, ownerToken}]

  function getWatches() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveWatches(watches) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(watches));
  }
  function tokenForId(id) {
    const w = getWatches().find(w => w.id === id);
    return w ? w.ownerToken : null;
  }

  function showBanner(message, kind = 'error') {
    const el = document.getElementById('banner');
    el.textContent = message;
    el.className = `banner show ${kind}`;
  }
  function hideBanner() {
    document.getElementById('banner').className = 'banner';
  }

  document.getElementById('advancedToggle').addEventListener('click', () => {
    document.getElementById('advancedToggle').classList.toggle('open');
    document.getElementById('advancedPanel').classList.toggle('open');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') addSection();
  });

  async function loadSections() {
    const watches = getWatches();
    const list = document.getElementById('targetList');
    const countEl = document.getElementById('targetCount');

    if (watches.length === 0) {
      list.innerHTML = '<div class="empty-state">No active snipes. Add one above!</div>';
      countEl.textContent = '';
      return;
    }

    try {
      const tokens = watches.map(w => w.ownerToken).join(',');
      const res = await fetch(API_URL, { headers: { 'X-Owner-Tokens': tokens } });
      const sections = await res.json();

      // Prune any local watch the server no longer knows about.
      const liveIds = new Set(sections.map(s => s.id));
      saveWatches(watches.filter(w => liveIds.has(w.id)));

      if (sections.length === 0) {
        list.innerHTML = '<div class="empty-state">No active snipes. Add one above!</div>';
        countEl.textContent = '';
        return;
      }

      countEl.textContent = `${sections.length} watched`;
      list.innerHTML = '';
      sections.forEach(s => list.appendChild(renderTarget(s)));
    } catch (e) {
      showBanner('Could not reach the server. Is it running?');
      console.error(e);
    }
  }

  function renderTarget(s) {
    const li = document.createElement('li');
    li.className = 'target' + (s.confirmed ? '' : ' unconfirmed');

    const prettyPhone = s.userContact.replace(/(\+1)(\d{3})(\d{3})(\d{4})/, '($2) $3-$4');
    const query = [s.subject, s.term, s.year, s.campus].filter(Boolean).join(' · ');

    if (s.confirmed) {
      li.innerHTML = `
        <div>
          <div class="target-index">#${s.sectionIndex}</div>
          <div class="target-meta">${prettyPhone} &nbsp;·&nbsp; ${query}</div>
        </div>
        <div class="target-actions">
          <span class="status-pill ${s.open ? 'open' : 'closed'}">${s.open ? 'Open!' : 'Closed'}</span>
          <button class="del-btn" title="Stop watching">✕</button>
        </div>
      `;
    } else {
      li.innerHTML = `
        <div class="target-header">
          <div>
            <div class="target-index">#${s.sectionIndex}</div>
            <div class="target-meta">${prettyPhone} &nbsp;·&nbsp; ${query}</div>
          </div>
          <span class="unverified-pill">Unverified</span>
        </div>
        <div class="verify-row">
          <input type="text" class="code-input" placeholder="6-digit code" maxlength="8" inputmode="numeric">
          <button class="verify-btn">Verify</button>
          <button class="del-btn" title="Cancel this watch">✕</button>
        </div>
        <div class="verify-footer">
          <span class="verify-hint">We texted a code to this number.</span>
          <button class="resend-btn">Resend code</button>
        </div>
      `;
    }

    const delBtn = li.querySelector('.del-btn');
    let confirmTimer = null;
    delBtn.addEventListener('click', () => {
      if (!delBtn.classList.contains('confirming')) {
        delBtn.classList.add('confirming');
        delBtn.textContent = s.confirmed ? 'Confirm' : '✕?';
        confirmTimer = setTimeout(() => {
          delBtn.classList.remove('confirming');
          delBtn.textContent = '✕';
        }, 3000);
        return;
      }
      clearTimeout(confirmTimer);
      deleteSection(s.id);
    });

    if (!s.confirmed) {
      const codeInput = li.querySelector('.code-input');
      const verifyBtn = li.querySelector('.verify-btn');
      const resendBtn = li.querySelector('.resend-btn');
      const hint = li.querySelector('.verify-hint');

      const submitCode = () => verifyCode(s.id, codeInput.value.trim(), li);
      verifyBtn.addEventListener('click', submitCode);
      codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitCode();
      });

      const DEFAULT_HINT = 'We texted a code to this number.';
      resendBtn.addEventListener('click', async () => {
        resendBtn.disabled = true;
        const ok = await resendCode(s.id);
        hint.textContent = ok ? 'New code sent.' : "Couldn't resend — try again shortly.";
        hint.className = ok ? 'verify-hint' : 'verify-error';
        setTimeout(() => {
          hint.textContent = DEFAULT_HINT;
          hint.className = 'verify-hint';
          resendBtn.disabled = false;
        }, 4000);
      });
    }

    return li;
  }

  async function addSection() {
    hideBanner();
    const indexInput = document.getElementById('index');
    const phoneInput = document.getElementById('phone');
    const addBtn = document.getElementById('addBtn');

    const index = indexInput.value.trim();
    const cleanPhone = phoneInput.value.replace(/\D/g, '');

    if (!index || index.length < 5) return showBanner('Please enter a valid 5-digit Course Index.');
    if (cleanPhone.length !== 10) return showBanner('Please enter a valid 10-digit phone number (e.g. 9085551234).');

    const subject = document.getElementById('subject').value.trim();
    const term = document.getElementById('term').value.trim();
    const yearRaw = document.getElementById('year').value.trim();
    const campus = document.getElementById('campus').value.trim();

    const body = {
      sectionIndex: index,
      userContact: '+1' + cleanPhone,
      subject: subject || null,
      term: term || null,
      year: yearRaw ? parseInt(yearRaw, 10) : null,
      campus: campus || null,
    };

    addBtn.disabled = true;
    addBtn.textContent = 'Adding…';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (res.status === 429) {
        showBanner("You're adding watches too quickly. Try again in a few minutes.");
        return;
      }
      if (!res.ok) {
        showBanner('Could not add that section. Double-check the details.');
        return;
      }

      const created = await res.json();
      const watches = getWatches();
      watches.push({ id: created.section.id, ownerToken: created.ownerToken });
      saveWatches(watches);

      indexInput.value = '';
      phoneInput.value = '';
      if (created.codeSent) {
        showBanner('We texted a verification code to your phone — enter it below to activate this watch.', 'info');
      }
      await loadSections();
    } catch (e) {
      showBanner('Could not reach the server. Is it running?');
      console.error(e);
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = 'Start Watching';
    }
  }

  async function verifyCode(id, code, cardEl) {
    const token = tokenForId(id);
    if (!token) return;
    if (!code) return setCardError(cardEl, 'Enter the code first.');

    const verifyBtn = cardEl.querySelector('.verify-btn');
    verifyBtn.disabled = true;
    verifyBtn.textContent = '…';

    try {
      const res = await fetch(`${API_URL}/${id}/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Token': token },
        body: JSON.stringify({ code }),
      });

      if (res.status === 422) {
        setCardError(cardEl, 'Incorrect or expired code.');
        return;
      }
      if (!res.ok) {
        setCardError(cardEl, 'Something went wrong. Try again.');
        return;
      }

      hideBanner();
      await loadSections();
    } catch (e) {
      setCardError(cardEl, 'Could not reach the server.');
      console.error(e);
    } finally {
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Verify';
    }
  }

  function setCardError(cardEl, message) {
    const hint = cardEl.querySelector('.verify-hint');
    hint.textContent = message;
    hint.className = 'verify-error';
  }

  async function resendCode(id) {
    const token = tokenForId(id);
    if (!token) return false;
    try {
      const res = await fetch(`${API_URL}/${id}/resend-code`, {
        method: 'POST',
        headers: { 'X-Owner-Token': token },
      });
      return res.ok;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  async function deleteSection(id) {
    const token = tokenForId(id);
    if (!token) return;

    try {
      const res = await fetch(`${API_URL}/${id}`, {
        method: 'DELETE',
        headers: { 'X-Owner-Token': token },
      });
      if (!res.ok && res.status !== 404) {
        showBanner('Could not remove that watch. Try again.');
        return;
      }
    } catch (e) {
      showBanner('Could not reach the server. Is it running?');
      console.error(e);
      return;
    }

    saveWatches(getWatches().filter(w => w.id !== id));
    await loadSections();
  }

  loadSections();
</script>

</body>
</html>
