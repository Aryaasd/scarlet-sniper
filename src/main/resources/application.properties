# Database Configuration (Reads from Cloud Environment)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate
# only validates the entity mapping matches it, never auto-alters the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Twilio Configuration (Reads from Cloud Environment)
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Optimize Database Pool for Low Memory
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2