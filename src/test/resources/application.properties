# Test-classpath override of src/main/resources/application.properties.
# Tests need an application context that boots without real Postgres/Twilio
# credentials, so this points at in-memory H2 the same way the local
# dev profile does.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

twilio.account.sid=test
twilio.auth.token=test
twilio.phone.number=+15555550100
